substitutions:
  version: "26.8.18.1"
  device_description: TEMP_PRO-1 made by Apollo Automation - version ${version}.

  # --- AMC Omni prototype pin map -------------------------------------------
  # WARNING: this branch is an AMC Omni PROTOTYPE and must NOT be merged or
  # released to the TEMP_PRO-1 fleet manifests as-is. On non-Omni hardware
  # GPIO36 floats and reads as a permanent "Door OPEN" (and the door-alarm
  # entities ship with it). Omni units only.
  # Display: ZJY-IPS130 1.3" 240x240 color IPS (ST7789, SPI) on the expansion
  # header, wired per Justin's bench layout 2026-08-15: GND->header 1,
  # VCC->power pin, SCL(SPI clock)->GPIO35 (header 9), SDA(SPI MOSI)->GPIO38
  # (header 8), RES->GPIO36 (header 4), DC->GPIO37 (header 5),
  # BLK->unconnected (backlight always on). Module has no CS pad, hence
  # spi_mode MODE3. The I2C header pins 2/3 belong to the onboard sensors
  # only — never wire the display there.
  display_sck_pin: GPIO35
  display_mosi_pin: GPIO38
  display_dc_pin: GPIO37
  display_reset_pin: GPIO36
  # Reed/door switch: bench-wired to header pins 6/7 — GPIO40 senses with the
  # internal pull-up, GPIO39 is held LOW as the return line. (These were the
  # LD2412 radar UART nets; the radar is dropped from the Omni in favor of a
  # simple PIR, which needs one GPIO on the next PCB spin — no free header
  # pin remains on this bench unit.)
  door_sense_pin: GPIO40
  door_return_pin: GPIO39

esphome:
  name: temp-pro-1
  includes:
    - <esp_system.h>
  # Runs on every deep-sleep entry, reboot, and OTA restart. Without this the
  # panel keeps showing its last frame through deep sleep — a stale cooler
  # temperature displayed as if live for up to the whole sleep duration.
  on_shutdown:
    then:
      - lambda: |-
          id(display_shutting_down) = true;
          id(omni_display).update();
  on_boot:
    # Priority 1200 runs before the Accessory Power switch (setup_priority
    # 1100) and the I2C bus (setup_priority BUS). Battery-focused firmware
    # (mqtt_toy, max-battery-life) cuts the GPIO7 sensor rail on shutdown with
    # gpio_hold_en, and that RTC pad hold survives reflashing, resets, and USB
    # power cycles while a battery keeps the RTC domain powered. Without this
    # release, a unit coming from that firmware boots with the rail latched
    # LOW: the switch logs ON but the pin cannot rise, unpowered sensors clamp
    # SCL, and the whole I2C bus scans empty. A no-op on pins never held.
    - priority: 1200
      then:
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_7);
            gpio_deep_sleep_hold_dis();
    - priority: -100
      then:
        - delay: 2s
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(id(deep_sleep_sleep_duration).state * 60 * 60 * 1000);
        - if:
            condition:
              or:
                - binary_sensor.is_on: ota_mode
                - switch.is_on: prevent_sleep
            then:
              - lambda: |-
                  ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA Or Switch On Boot");
                  id(deep_sleep_1).prevent_deep_sleep();
        - lambda: |-
            // Force initial updates on boot
            id(sht_temperature).publish_state(id(sht_temperature_raw).state);
            id(sht_humidity).publish_state(id(sht_humidity_raw).state);
            id(last_temp_update) = millis();
            id(last_humidity_update) = millis();
    - priority: -100
      then:
        # AMC Omni: alarm latches start resolved. A door already open at boot
        # is handled by publish_initial_state on the door sensor (fires
        # on_press -> timer); an interior already over-temp at boot starts its
        # timer on the first Dallas reading.
        - lambda: |-
            id(door_open_too_long).publish_state(false);
            id(interior_temp_too_long).publish_state(false);
    - priority: -100
      then:
        - lambda: |-
            // Boot diagnostics: wake cause, crash counter, firmware version.
            // Additive only; touches no existing entity.
            switch (esp_sleep_get_wakeup_cause()) {
              case ESP_SLEEP_WAKEUP_TIMER:
                id(wake_cause).publish_state("Timer");
                break;
              case ESP_SLEEP_WAKEUP_EXT0:
              case ESP_SLEEP_WAKEUP_EXT1:
              case ESP_SLEEP_WAKEUP_GPIO:
                id(wake_cause).publish_state("GPIO");
                break;
              case ESP_SLEEP_WAKEUP_UNDEFINED:
                id(wake_cause).publish_state("Power-on/Reset");
                break;
              default:
                id(wake_cause).publish_state("Other");
                break;
            }
            const esp_reset_reason_t r = esp_reset_reason();
            if (r == ESP_RST_PANIC || r == ESP_RST_INT_WDT || r == ESP_RST_TASK_WDT ||
                r == ESP_RST_WDT || r == ESP_RST_BROWNOUT) {
              id(crash_count) += 1;
            }
            id(crash_count_sensor).publish_state(id(crash_count));
            id(firmware_version).publish_state("${version}");
            if (id(last_ota_error_code) >= 0) {
              char buf[24];
              snprintf(buf, sizeof(buf), "Error %d", id(last_ota_error_code));
              id(last_ota_error).publish_state(buf);
            } else {
              id(last_ota_error).publish_state("None");
            }

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source: github://ApolloAutomation/esphome-battery-component
    components: [max17048]

api:
  actions:
    - action: play_buzzer
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
  reboot_timeout: 0s
  on_client_connected:
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA Or Switch");
          else:
            - switch.turn_on: accessory_power
            - delay: 5s
            - lambda: |-
                id(reportAllValues).execute();
            - delay: 5s
            - lambda: |-
                // Check alarm conditions directly
                id(alarm_triggered_on_wake) = false;

                // Check temperature alarm (only if value is valid)
                if (id(alarm_outside_temp_range).state &&
                    !std::isnan(id(sht_temperature).state) &&
                    (id(sht_temperature).state > id(max_temp).state || id(sht_temperature).state < id(min_temp).state)) {
                  id(alarm_triggered_on_wake) = true;
                  ESP_LOGW("Apollo", "Temperature alarm triggered");
                }

                // Check humidity alarm (only if value is valid)
                if (id(alarm_outside_humidity_range).state &&
                    !std::isnan(id(sht_humidity).state) &&
                    (id(sht_humidity).state > id(max_humidity).state || id(sht_humidity).state < id(min_humidity).state)) {
                  id(alarm_triggered_on_wake) = true;
                  ESP_LOGW("Apollo", "Humidity alarm triggered");
                }

                // Interior over-temp: instantaneous threshold check. The
                // duration latch cannot elapse inside a 90s wake window, and
                // after an hour asleep "hot now" means "has been hot".
                if (id(alarm_interior_temp).state &&
                    !std::isnan(id(dallas_temp_probe).state) &&
                    id(dallas_temp_probe).state > id(max_interior_temp).state) {
                  id(alarm_triggered_on_wake) = true;
                  ESP_LOGW("Apollo", "Interior temperature alarm triggered");
                }

                if (id(alarm_triggered_on_wake)) {
                  ESP_LOGW("Apollo", "Alarm Active - Staying Awake");
                  id(deep_sleep_1).prevent_deep_sleep();
                  // Trigger alarm sound and light (user-gated; both default ON)
                  if (id(alarm_led_enabled).state) {
                    id(rgb_light).turn_on().set_effect("Fast Pulse").perform();
                    id(rgb_light).turn_on().set_rgb(1, 0, 0).set_transition_length(0).perform();
                  }
                  if (id(buzzer_enabled).state) {
                    id(rtttl_buzzer).play(id(alarm_tone).state);
                  }
                }
            - if:
                condition:
                  and:
                    - lambda: 'return !id(alarm_triggered_on_wake);'
                    - switch.is_off: prevent_sleep
                    - binary_sensor.is_off: ota_mode
                then:
                  - deep_sleep.enter:
                      id: deep_sleep_1

globals:
  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: button_press_timestamp
    restore_value: no
    type: uint32_t
    initial_value: '0'
  - id: alarm_triggered_on_wake
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_temp_update
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_humidity_update
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: crash_count
    type: int
    restore_value: yes
    initial_value: '0'
  - id: last_ota_error_code
    type: int
    restore_value: yes
    initial_value: '-1'
  # Set on shutdown so the final display update paints a black frame; the
  # ili9xxx driver has no panel-off command exposed, unlike the old SSD1306.
  - id: display_shutting_down
    type: bool
    restore_value: no
    initial_value: 'false'
  # Battery screen saver: millis() deadline until which the screen stays
  # awake. Initialized to 60s so every boot shows the screen for a minute.
  - id: screen_wake_until
    type: uint32_t
    restore_value: no
    initial_value: '60000'

i2c:
  - sda: GPIO16
    scl: GPIO17
    id: bus_a

# Dedicated SPI bus for the ST7789 display (bench: expansion-header pins).
# interface spi3: the ETH variant's W5500 owns SPI2 (GPIO9-12).
spi:
  clk_pin: ${display_sck_pin}
  mosi_pin: ${display_mosi_pin}
  interface: spi3

web_server:
  port: 80

debug:
  update_interval: 60s

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 1h
  run_duration: 90s

one_wire:
  - platform: gpio
    id: ow_probe
    # Internal pull-up as a safety net for proto boards missing the external
    # 4.7k. Marginal for 1-Wire but workable for one probe on a short lead;
    # harmless in parallel with a real pull-up on production boards.
    pin:
      number: GPIO6
      mode:
        input: true
        output: true
        open_drain: true
        pullup: true
  # ------------------------------------------------------------------------
  # TEMPORARY DIAGNOSTIC (remove before release): the omni proto's probe jack
  # does not answer on GPIO6, so sweep every plausible spare pin. Whichever
  # bus logs a found device at boot is where the jack actually routes.
  - platform: gpio
    id: ow_diag_01
    pin: { number: GPIO1, mode: { input: true, output: true, open_drain: true, pullup: true } }
  - platform: gpio
    id: ow_diag_02
    pin: { number: GPIO2, mode: { input: true, output: true, open_drain: true, pullup: true } }
  - platform: gpio
    id: ow_diag_03
    pin: { number: GPIO3, ignore_strapping_warning: true, mode: { input: true, output: true, open_drain: true, pullup: true } }
  - platform: gpio
    id: ow_diag_05
    pin: { number: GPIO5, mode: { input: true, output: true, open_drain: true, pullup: true } }
  # (GPIO9-14 are excluded from the sweep: the ETH variant's W5500 uses them.)
  - platform: gpio
    id: ow_diag_15
    pin: { number: GPIO15, mode: { input: true, output: true, open_drain: true, pullup: true } }
  - platform: gpio
    id: ow_diag_18
    pin: { number: GPIO18, mode: { input: true, output: true, open_drain: true, pullup: true } }
  - platform: gpio
    id: ow_diag_21
    pin: { number: GPIO21, mode: { input: true, output: true, open_drain: true, pullup: true } }
  - platform: gpio
    id: ow_diag_33
    pin: { number: GPIO33, mode: { input: true, output: true, open_drain: true, pullup: true } }
  - platform: gpio
    id: ow_diag_34
    pin: { number: GPIO34, mode: { input: true, output: true, open_drain: true, pullup: true } }
  - platform: gpio
    id: ow_diag_47
    pin: { number: GPIO47, mode: { input: true, output: true, open_drain: true, pullup: true } }
  - platform: gpio
    id: ow_diag_48
    pin: { number: GPIO48, mode: { input: true, output: true, open_drain: true, pullup: true } }
  # ------------------------------------------------------------------------

# Buzzer
output:
  - platform: ledc
    pin: GPIO8
    id: buzzer

rtttl:
  id: rtttl_buzzer
  output: buzzer

# AMC Omni display. Fonts are fetched from Google Fonts at compile time.
font:
  - file: gfonts://Roboto+Condensed@700
    id: font_big
    size: 50
  - file: gfonts://Roboto+Condensed@700
    id: font_label
    size: 20
  - file: gfonts://Roboto+Condensed
    id: font_small
    size: 16

display:
  - platform: ili9xxx
    id: omni_display
    model: ST7789V
    dc_pin: ${display_dc_pin}
    reset_pin: ${display_reset_pin}
    # No cs_pin: the ZJY-IPS130 module has no CS pad, hence MODE3.
    spi_mode: mode3
    data_rate: 20MHz
    dimensions:
      width: 240
      height: 240
    invert_colors: true
    # Landscape mounting, flipped to match the case orientation (was 90).
    rotation: 270
    update_interval: 1s
    lambda: |-
      if (id(display_shutting_down) || !id(display_enabled).state) return;

      // Battery screen saver: on battery power, blank the screen unless it
      // was recently woken (motion/door/power event) or an alarm is latched.
      // NOTE: with BLK hardwired on, "blank" is a black frame — the backlight
      // itself needs a GPIO on the next PCB spin for true dark + power saving.
      if (id(battery_screensaver).state && !id(external_power).state &&
          millis() > id(screen_wake_until) &&
          !id(door_open_too_long).state && !id(interior_temp_too_long).state &&
          !id(alarm_active).state) {
        return;
      }

      const auto C_WHITE = Color(255, 255, 255);
      const auto C_GRAY  = Color(140, 140, 140);
      const auto C_RED   = Color(255, 45, 45);
      const auto C_GREEN = Color(45, 210, 90);
      const auto C_AMBER = Color(255, 170, 0);
      const auto C_NAVY  = Color(30, 43, 79);  // HALO brand navy

      // Boot splash: the HALO brand lockup on white, drawn vectorially.
      if (millis() < 6000) {
        it.fill(C_WHITE);
        // H ring mark with the red dot accent
        for (int r = 42; r <= 44; r++) it.circle(120, 76, r, C_NAVY);
        it.filled_circle(151, 107, 6, C_RED);
        it.printf(120, 76, id(font_big), C_NAVY, display::TextAlign::CENTER, "H");
        // HALO wordmark: navy HAL + red O, centered as a unit
        int bx, by, w1, w2, bh;
        it.get_text_bounds(0, 0, "HAL", id(font_big), display::TextAlign::TOP_LEFT, &bx, &by, &w1, &bh);
        it.get_text_bounds(0, 0, "O", id(font_big), display::TextAlign::TOP_LEFT, &bx, &by, &w2, &bh);
        int hx = (240 - w1 - w2) / 2;
        it.print(hx, 126, id(font_big), C_NAVY, "HAL");
        it.print(hx + w1, 126, id(font_big), C_RED, "O");
        // Sub-brand lines
        it.get_text_bounds(0, 0, "by MyMortuary", id(font_small), display::TextAlign::TOP_LEFT, &bx, &by, &w1, &bh);
        it.get_text_bounds(0, 0, "Cooler", id(font_small), display::TextAlign::TOP_LEFT, &bx, &by, &w2, &bh);
        hx = (240 - w1 - w2) / 2;
        it.print(hx, 186, id(font_small), C_NAVY, "by MyMortuary");
        it.print(hx + w1, 186, id(font_small), C_RED, "Cooler");
        it.printf(120, 208, id(font_small), C_NAVY, display::TextAlign::TOP_CENTER,
                  "S M A R T  M O N I T O R I N G");
        return;
      }

      // Client color language: red = inside, blue = outside.
      const auto C_BLUE = Color(70, 150, 255);

      // Top strip: HALO brand bar, replaced by a FLASHING red banner while
      // any alarm latch is active. With multiple alarms latched, successive
      // flashes rotate through them.
      const char *alarm_texts[3];
      int n_alarms = 0;
      if (id(door_open_too_long).state)     alarm_texts[n_alarms++] = "DOOR OPEN TOO LONG";
      if (id(interior_temp_too_long).state) alarm_texts[n_alarms++] = "INSIDE TEMP TOO HIGH";
      if (id(alarm_active).state)           alarm_texts[n_alarms++] = "SENSOR ALARM";
      if (n_alarms > 0 && (millis() / 1000) % 2 == 0) {
        it.filled_rectangle(0, 0, 240, 26, C_RED);
        it.printf(120, 2, id(font_label), C_WHITE, display::TextAlign::TOP_CENTER,
                  "%s", alarm_texts[(millis() / 2000) % n_alarms]);
      } else {
        // Mini H-ring mark + HALO wordmark, centered as a group
        int bx, by, w1, w2, bh;
        it.get_text_bounds(0, 0, "HAL", id(font_label), display::TextAlign::TOP_LEFT, &bx, &by, &w1, &bh);
        it.get_text_bounds(0, 0, "O", id(font_label), display::TextAlign::TOP_LEFT, &bx, &by, &w2, &bh);
        int x = (240 - (20 + 8 + w1 + w2)) / 2;
        it.circle(x + 10, 12, 10, C_WHITE);
        it.circle(x + 10, 12, 9, C_WHITE);
        it.filled_circle(x + 17, 19, 3, C_RED);
        it.printf(x + 10, 12, id(font_small), C_WHITE, display::TextAlign::CENTER, "H");
        x += 28;
        it.print(x, 2, id(font_label), C_WHITE, "HAL");
        it.print(x + w1, 2, id(font_label), C_RED, "O");
      }

      // Column labels under the brand bar
      it.printf(60, 26, id(font_label), C_RED, display::TextAlign::TOP_CENTER, "INSIDE");
      it.printf(180, 26, id(font_label), C_BLUE, display::TextAlign::TOP_CENTER, "OUTSIDE");

      // The two headline Fahrenheit readings; outside RH tucked underneath.
      it.line(120, 30, 120, 126, C_GRAY);
      it.line(0, 130, 239, 130, C_GRAY);
      if (id(dallas_temp_probe).has_state() && !std::isnan(id(dallas_temp_probe).state)) {
        const float f = id(dallas_temp_probe).state;  // already °F
        it.printf(60, 48, id(font_big), C_RED, display::TextAlign::TOP_CENTER,
                  f >= 100.0f || f <= -10.0f ? "%.0f°" : "%.1f°", f);
      } else {
        it.printf(60, 48, id(font_big), C_GRAY, display::TextAlign::TOP_CENTER, "--");
        it.printf(60, 108, id(font_small), C_GRAY, display::TextAlign::TOP_CENTER, "NO PROBE");
      }
      if (!std::isnan(id(sht_temperature).state)) {
        const float f = id(sht_temperature).state;  // already °F
        it.printf(180, 48, id(font_big), C_BLUE, display::TextAlign::TOP_CENTER,
                  f >= 100.0f || f <= -10.0f ? "%.0f°" : "%.1f°", f);
      } else {
        it.printf(180, 48, id(font_big), C_GRAY, display::TextAlign::TOP_CENTER, "--");
      }
      if (!std::isnan(id(sht_humidity).state)) {
        it.printf(180, 106, id(font_label), C_BLUE, display::TextAlign::TOP_CENTER,
                  "RH %.0f%%", id(sht_humidity).state);
      }

      // Door row: full-width bar when open, matching the motion row below.
      if (id(door_sensor).state) {
        it.filled_rectangle(0, 134, 240, 32, C_RED);
        it.printf(120, 139, id(font_label), C_WHITE, display::TextAlign::TOP_CENTER, "DOOR OPEN");
      } else {
        it.printf(120, 139, id(font_label), C_GREEN, display::TextAlign::TOP_CENTER, "DOOR CLOSED");
      }

      // Motion row: same full-width treatment (PIR feeds this on the next PCB).
      if (id(motion_detected).state) {
        it.filled_rectangle(0, 172, 240, 32, C_AMBER);
        it.printf(120, 177, id(font_label), C_WHITE, display::TextAlign::TOP_CENTER, "MOTION DETECTED");
      } else {
        it.printf(120, 177, id(font_label), C_GRAY, display::TextAlign::TOP_CENTER, "NO MOTION");
      }

      // Bottom row: IP + network name in the middle, battery bottom-right.
      // (Network branch guarded so the ETH variant still builds.)
      #ifdef USE_WIFI
      if (wifi::global_wifi_component->is_connected()) {
        auto ips = wifi::global_wifi_component->wifi_sta_ip_addresses();
        std::string ip = "no IP";
        for (auto &addr : ips) {
          if (addr.is_set()) { ip = addr.str(); break; }
        }
        it.printf(8, 216, id(font_small), C_GRAY, "%s", ip.c_str());
        std::string ssid = wifi::global_wifi_component->wifi_ssid();
        if (ssid.length() > 7) ssid = ssid.substr(0, 6) + ".";
        it.printf(116, 216, id(font_small), C_GRAY, "%s", ssid.c_str());
      } else {
        it.printf(8, 216, id(font_small), C_GRAY, "WiFi connecting...");
      }
      #else
      if (ethernet::global_eth_component->is_connected()) {
        auto ips = ethernet::global_eth_component->get_ip_addresses();
        std::string ip = "no IP";
        for (auto &addr : ips) {
          if (addr.is_set()) { ip = addr.str(); break; }
        }
        it.printf(8, 216, id(font_small), C_GRAY, "%s", ip.c_str());
        it.printf(116, 216, id(font_small), C_GRAY, "ETH");
      } else {
        it.printf(8, 216, id(font_small), C_GRAY, "ETH link down");
      }
      #endif
      // Battery, bottom-right: columns sized so a worst-case 15-char IP
      // (ends ~x113), 7-char SSID (ends ~x168), and the 4-glyph "100%"
      // (starts ~x202) never collide with the icon (ends x197 incl. nub).
      if (!std::isnan(id(batt_pct).state)) {
        const int pct = (int) id(batt_pct).state;
        const auto batt_color = pct > 50 ? C_GREEN : pct > 20 ? C_AMBER : C_RED;
        it.rectangle(172, 217, 22, 13, C_WHITE);
        it.filled_rectangle(194, 220, 3, 7, C_WHITE);  // terminal nub
        const int fill = (pct * 18) / 100;
        if (fill > 0) it.filled_rectangle(174, 219, fill, 9, batt_color);
        it.printf(232, 215, id(font_small), C_WHITE, display::TextAlign::TOP_RIGHT, "%d%%", pct);
      }

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
    disabled_by_default: true
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    id: reset_button
    on_press:
      then:
        - lambda: |-
            id(button_press_timestamp) = millis();    
    on_release:
      then:
        - lambda: |-
            if (millis() - id(button_press_timestamp) >= 10000) {
              // Remove Wifi
              id(factory_reset_switch).turn_on();
            }
            else {
              // StatusCheck
              id(statusCheck).execute();
            }

  # AMC Omni reed/door sensor. Assumes a normally-open reed held closed by the
  # door magnet: door closed -> circuit closed -> pin pulled LOW. If a bench
  # unit reads backwards (normally-closed reed), add inverted: true to the pin.
  - platform: gpio
    name: "Door"
    id: door_sensor
    device_class: door
    pin:
      number: ${door_sense_pin}
      mode:
        input: true
        pullup: true
    # Initial state runs on_press/on_release too, so a unit booting with the
    # door already open starts the open-too-long timer without a special case.
    publish_initial_state: true
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    # Redraw immediately on any door change so the display cadence never
    # makes the door state feel laggy; door activity also wakes the battery
    # screen saver.
    on_state:
      then:
        - lambda: |-
            id(screen_wake_until) = millis() + (uint32_t)(id(screen_wake_time).state * 1000.0f);
        - component.update: omni_display
    on_press:
      then:
        - script.execute: door_open_timer
    on_release:
      then:
        - script.stop: door_open_timer
        - lambda: |-
            if (id(door_open_too_long).state) {
              id(door_open_too_long).publish_state(false);
              // Release the LED unless another alarm source still owns it.
              if (!id(alarm_active).state && !id(interior_temp_too_long).state) {
                id(rgb_light).turn_off().perform();
              }
            }

  # Latched by door_open_timer once the door has been open longer than
  # Max Door Open Duration; cleared the moment the door closes.
  - platform: template
    name: "Door Open Too Long"
    id: door_open_too_long
    device_class: problem
    disabled_by_default: true

  # Motion placeholder: the Omni drops the LD2412 radar for a simple PIR.
  # No header GPIO is free on this bench unit; when the next PCB gives the
  # PIR a pin, replace this template with a gpio binary_sensor (same id) and
  # everything downstream (display row, HA entity) lights up unchanged.
  - platform: template
    name: "Motion"
    id: motion_detected
    device_class: motion
    on_state:
      then:
        # Motion wakes the battery screen saver.
        - lambda: |-
            id(screen_wake_until) = millis() + (uint32_t)(id(screen_wake_time).state * 1000.0f);
        - component.update: omni_display

  # Wall power vs battery, inferred from the fuel gauge's discharge rate —
  # the board has no VBUS sense pin. Unknown reads as powered so the screen
  # fails visible. Doubles as the "power is out" signal for HA notifications.
  - platform: template
    name: "External Power"
    id: external_power
    device_class: plug
    lambda: |-
      if (std::isnan(id(batt_rate).state)) return true;
      return id(batt_rate).state > -1.0f;
    filters:
      - delayed_on: 10s
      - delayed_off: 60s
    on_state:
      then:
        # Power state changes wake the screen so the moment is visible.
        - lambda: |-
            id(screen_wake_until) = millis() + (uint32_t)(id(screen_wake_time).state * 1000.0f);
        - component.update: omni_display

  # Latched when the inside (probe) temp has been above Max Inside
  # Temperature continuously for Inside Temp Alarm Duration; cleared once it
  # recovers.
  - platform: template
    name: "Inside Temp Too High"
    id: interior_temp_too_long
    device_class: problem
    disabled_by_default: true

  - platform: template
    name: Outside Temp Within Range
    id: temp_within_range
    disabled_by_default: true
    lambda: 'return std::isnan(id(sht_temperature).state) || ((id(sht_temperature).state <= id(max_temp).state) && (id(sht_temperature).state >= id(min_temp).state));'

  - platform: template
    name: Outside Humidity Within Range
    id: humidity_within_range
    disabled_by_default: true
    lambda: 'return std::isnan(id(sht_humidity).state) || ((id(sht_humidity).state <= id(max_humidity).state) && (id(sht_humidity).state >= id(min_humidity).state));'

  - platform: template
    name: Alarm Active
    id: alarm_active
    disabled_by_default: true
    lambda: 'return (id(alarm_outside_temp_range).state && !id(temp_within_range).state) || (id(alarm_outside_humidity_range).state && !id(humidity_within_range).state);'
    on_release:
      then:
        - light.turn_off: rgb_light
        - if:
            condition:
              and:
                - switch.is_off: prevent_sleep
                - binary_sensor.is_off: ota_mode
                # A latched door/interior alarm keeps the unit awake too.
                - binary_sensor.is_off: door_open_too_long
                - binary_sensor.is_off: interior_temp_too_long
            then:
              - lambda: |-
                  ESP_LOGW("Apollo", "Alarm cleared - going back to sleep");
                  id(deep_sleep_1).allow_deep_sleep();
              - delay: 2s
              - deep_sleep.enter:
                  id: deep_sleep_1

  # Sensor-health diagnostics. A failed sensor otherwise freezes at its last
  # value and keeps republishing it, indistinguishable from a healthy one.
  - platform: template
    name: "SHT30 Sensor Fault"
    id: sht30_sensor_fault
    device_class: problem
    entity_category: diagnostic
    disabled_by_default: true
    lambda: 'return id(sht3xd_sensor).status_has_warning() || id(sht3xd_sensor).is_failed();'

  - platform: template
    name: "Inside Probe Connected"
    id: dallas_probe_connected
    device_class: connectivity
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      // Stay 'unknown' until the probe has reported once; publishing before the
      // first conversion would show a false Disconnected on every boot.
      if (!id(dallas_temp_probe).has_state()) return {};
      return !std::isnan(id(dallas_temp_probe).state);

  - platform: homeassistant
    name: "OTA Mode"
    id: ota_mode
    entity_id: input_boolean.apollo_ota_mode
    disabled_by_default: true
    on_press:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_release:
      then:
        - if:
            condition:
              switch.is_off: prevent_sleep
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

sensor:
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature
    unit_of_measurement: "°F"
    filters:
      - lambda: 'return x * 9.0f / 5.0f + 32.0f;'
    disabled_by_default: true

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s
    disabled_by_default: true

  # SAE-native: the SHT30 reads Celsius; the raw filter converts to
  # Fahrenheit and applies the (Fahrenheit) user offset in one step.
  - platform: sht3xd
    id: sht3xd_sensor
    i2c_id: bus_a
    temperature:
      name: "Outside Temperature Raw"
      id: sht_temperature_raw
      internal: true
      filters:
        - lambda: 'return x * 9.0f / 5.0f + 32.0f + id(sht_temperature_offset).state;'
    humidity:
      name: "Outside Humidity Raw"
      id: sht_humidity_raw
      internal: true
      filters:
        - lambda: 'return x + id(sht_humidity_offset).state;'
    update_interval: 10s

  # Template sensors with configurable intervals
  - platform: template
    name: "Outside Temperature"
    id: sht_temperature
    lambda: 'return id(sht_temperature_raw).state;'
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "Outside Humidity"
    id: sht_humidity
    lambda: 'return id(sht_humidity_raw).state;'
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  # SAE-native inside probe: Celsius from the DS18B20, converted to
  # Fahrenheit with the (Fahrenheit) user offset in the filter.
  - platform: dallas_temp
    name: "Inside Temperature"
    id: dallas_temp_probe
    one_wire_id: ow_probe
    unit_of_measurement: "°F"
    update_interval: 60s
    filters:
      - lambda: 'return x * 9.0f / 5.0f + 32.0f + id(dallas_temp_offset).state;'
    on_value:
      then:
        - lambda: |-
            // Inside over-temp watch. A NaN read (CRC glitch, probe blip)
            // carries no information: it must neither reset the pending timer
            // nor clear an active latch — only a valid reading at/below the
            // ceiling counts as recovery.
            if (std::isnan(x)) return;
            if (x > id(max_interior_temp).state) {
              if (!id(interior_temp_timer).is_running() && !id(interior_temp_too_long).state) {
                id(interior_temp_timer).execute();
              }
            } else {
              id(interior_temp_timer).stop();
              if (id(interior_temp_too_long).state) {
                id(interior_temp_too_long).publish_state(false);
                // Release the LED unless another alarm source still owns it.
                if (!id(alarm_active).state && !id(door_open_too_long).state) {
                  id(rgb_light).turn_off().perform();
                }
              }
            }

  - platform: max17048
    id: max_17048
    i2c_id: bus_a
    battery_voltage:
      name: Battery voltage
      id: batt_v
      disabled_by_default: true
    battery_level:
      name: Battery level
      id: batt_pct
      disabled_by_default: true
      filters:
        - lambda: |
            if (x > 100) return 100;
            else return (x);
    # CRATE register (%/hr): negative = discharging = running on battery.
    # Feeds the External Power detection and the battery screen saver.
    rate:
      name: "Battery Rate"
      id: batt_rate
      entity_category: diagnostic
      disabled_by_default: true

  # Runtime health diagnostics
  - platform: debug
    free:
      name: "Heap Free"
      id: debug_heap_free
      entity_category: diagnostic
      disabled_by_default: true
    block:
      name: "Heap Max Block"
      id: debug_heap_block
      entity_category: diagnostic
      disabled_by_default: true
    loop_time:
      name: "Loop Time"
      id: debug_loop_time
      entity_category: diagnostic
      disabled_by_default: true

  # Persisted count of crash-type resets (panic/watchdog/brownout). Uptime
  # cannot reveal crashes on units that reboot every deep-sleep wake.
  - platform: template
    name: "Crash Count"
    id: crash_count_sensor
    icon: "mdi:alert-circle-outline"
    entity_category: diagnostic
    disabled_by_default: true
    accuracy_decimals: 0
    update_interval: never

light:
  - platform: esp32_rmt_led_strip
    id: rgb_light
    name: "RGB Light"
    pin: GPIO4
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 4
    rgb_order: grb
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 1000ms
          update_interval: 1000ms
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

button:
  - platform: template
    name: "Update Firmware"
    id: update_firmware
    entity_category: config
    on_press:
      then:
        - lambda: |-
            id(update_http_request).perform(true);
    
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"

  - platform: factory_reset
    disabled_by_default: True
    name: "Factory Reset ESP"
    id: factory_reset_all

  # Remote rescue: reboot into safe mode (network + OTA only). The only other
  # remote levers are a plain reboot or a provisioning-destroying factory reset.
  - platform: safe_mode
    name: "Safe Mode Boot"
    id: safe_mode_boot
    entity_category: diagnostic
    disabled_by_default: true

number:
  # All temperature settings are native Fahrenheit (SAE-only product).
  - platform: template
    id: min_temp
    name: Min Outside Temperature
    min_value: -76
    max_value: 212
    step: 0.1
    unit_of_measurement: '°F'
    initial_value: -4
    optimistic: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true

  - platform: template
    id: max_temp
    name: Max Outside Temperature
    min_value: -76
    max_value: 212
    step: 0.1
    unit_of_measurement: '°F'
    initial_value: 212
    optimistic: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true

  - platform: template
    id: min_humidity
    name: Min Outside Humidity
    min_value: 0
    max_value: 100
    step: 0.1
    unit_of_measurement: '%'
    initial_value: 0
    optimistic: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true

  - platform: template
    id: max_humidity
    name: Max Outside Humidity
    min_value: 0
    max_value: 100
    step: 0.1
    unit_of_measurement: '%'
    initial_value: 100
    optimistic: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true

  # Configurable temperature and humidity intervals (in minutes)
  - platform: template
    id: temperature_update_interval
    name: "Outside Temperature Update Interval"
    min_value: 1
    max_value: 1000
    step: 1
    unit_of_measurement: 'm'
    initial_value: 1
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    disabled_by_default: true
    on_value:
      then:
        - lambda: |-
            // Force immediate temperature update when interval changes
            id(sht_temperature).publish_state(id(sht_temperature_raw).state);
            id(last_temp_update) = millis();

  - platform: template
    id: humidity_update_interval
    name: "Outside Humidity Update Interval"
    min_value: 1
    max_value: 1000
    step: 1
    unit_of_measurement: 'm'
    initial_value: 1
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    disabled_by_default: true
    on_value:
      then:
        - lambda: |-
            // Force immediate humidity update when interval changes
            id(sht_humidity).publish_state(id(sht_humidity_raw).state);
            id(last_humidity_update) = millis();

  - platform: template
    name: "Max Door Open Duration"
    id: max_door_open_duration
    min_value: 0.5
    max_value: 120
    step: 0.5
    unit_of_measurement: 'min'
    initial_value: 5
    optimistic: true
    restore_value: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true

  # Inside ceiling for the over-temp alarm. Its own number, NOT max_temp:
  # max_temp belongs to the outside-air (SHT) alarm chain, and sharing it
  # would make a realistic cooler ceiling trip the ambient alarm forever.
  - platform: template
    name: "Max Inside Temperature"
    id: max_interior_temp
    min_value: -76
    max_value: 212
    step: 0.1
    unit_of_measurement: '°F'
    initial_value: 45
    optimistic: true
    restore_value: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true

  # How long the inside may sit above Max Inside Temperature before the
  # Inside Temp Too High alarm latches.
  - platform: template
    name: "Inside Temp Alarm Duration"
    id: interior_temp_alarm_duration
    min_value: 0.5
    max_value: 120
    step: 0.5
    unit_of_measurement: 'min'
    initial_value: 5
    optimistic: true
    restore_value: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true

  # How long the battery screen saver keeps the screen on after activity.
  - platform: template
    name: "Screen Wake Time"
    id: screen_wake_time
    min_value: 5
    max_value: 600
    step: 5
    unit_of_measurement: 's'
    initial_value: 30
    optimistic: true
    restore_value: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true

  # Deep sleep duration configuration
  - platform: template
    name: "Sleep Duration"
    id: deep_sleep_sleep_duration
    min_value: 0.01
    max_value: 24
    step: 0.01
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 1
    icon: "mdi:arrow-collapse-right"
    entity_category: CONFIG
    unit_of_measurement: "h"
    disabled_by_default: true
    on_value:
      then:
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(x * 60 * 60 * 1000);

  # Calibration offsets. Applied as filters on the raw sensor channels; the
  # default 0.0 reproduces shipping readings exactly. Takes effect at the
  # next measurement (<=10s SHT30, <=60s Dallas).
  - platform: template
    name: "Outside Temperature Offset"
    id: sht_temperature_offset
    min_value: -18
    max_value: 18
    step: 0.1
    unit_of_measurement: '°F'
    initial_value: 0
    optimistic: true
    restore_value: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true

  - platform: template
    name: "Outside Humidity Offset"
    id: sht_humidity_offset
    min_value: -20
    max_value: 20
    step: 0.5
    unit_of_measurement: '%'
    initial_value: 0
    optimistic: true
    restore_value: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true

  - platform: template
    name: "Inside Temperature Offset"
    id: dallas_temp_offset
    min_value: -18
    max_value: 18
    step: 0.1
    unit_of_measurement: '°F'
    initial_value: 0
    optimistic: true
    restore_value: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true

  # Status LED brightness for the button status check (default 100% =
  # shipping). Alarm flashes keep their pulse effect, which dictates its own
  # brightness envelope; alarm control is the enable switch only.
  - platform: template
    name: "Status LED Brightness"
    id: status_led_brightness
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: '%'
    initial_value: 100
    optimistic: true
    restore_value: true
    update_interval: never
    mode: slider
    entity_category: config
    disabled_by_default: true

  # rtttl gain; 60% equals the component default the firmware ships with.
  - platform: template
    name: "Buzzer Volume"
    id: buzzer_volume
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: '%'
    initial_value: 60
    optimistic: true
    restore_value: true
    update_interval: never
    mode: slider
    entity_category: config
    disabled_by_default: true
    on_value:
      then:
        - lambda: |-
            id(rtttl_buzzer).set_gain(x / 100.0f);

  - platform: template
    name: "Inside Temp Update Interval"
    id: dallas_update_interval
    min_value: 5
    max_value: 3600
    step: 1
    unit_of_measurement: 's'
    initial_value: 60
    optimistic: true
    restore_value: true
    update_interval: never
    mode: box
    entity_category: config
    disabled_by_default: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x) || x < 5) return;
            id(dallas_temp_probe).stop_poller();
            id(dallas_temp_probe).set_update_interval((uint32_t) (x * 1000));
            id(dallas_temp_probe).start_poller();

switch:
  - platform: factory_reset
    id: factory_reset_switch
    internal: true

  - platform: gpio
    pin: GPIO7
    name: "Accessory Power"
    id: accessory_power
    restore_mode: ALWAYS_ON
    setup_priority: 1100
    internal: true

  # Door reed return line: held LOW so the reed can pull the sense pin down.
  - platform: gpio
    pin: ${door_return_pin}
    id: door_sensor_return
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: template
    name: "Alarm Outside Temp Out Of Range"
    id: alarm_outside_temp_range
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true

  - platform: template
    name: "Alarm Outside Humidity Out Of Range"
    id: alarm_outside_humidity_range
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true

  - platform: template
    name: "Alarm Door Open Too Long"
    id: alarm_door_open
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true
    # Silencing the alarm mid-latch must also stop the LED it started —
    # otherwise nothing ever turns it off (the 10s interval stops re-firing
    # but the flash effect runs forever).
    on_turn_off:
      then:
        - lambda: |-
            if (id(door_open_too_long).state && !id(alarm_active).state &&
                !id(interior_temp_too_long).state) {
              id(rgb_light).turn_off().perform();
            }

  # LED/buzzer for the Inside Temp Too High latch; the flashing on-screen
  # banner runs regardless of this switch.
  - platform: template
    name: "Alarm Inside Temp High"
    id: alarm_interior_temp
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true
    on_turn_off:
      then:
        - lambda: |-
            if (id(interior_temp_too_long).state && !id(alarm_active).state &&
                !id(door_open_too_long).state) {
              id(rgb_light).turn_off().perform();
            }

  # Master enable for HALO webhook reporting; needs Device ID + Secret set.
  - platform: template
    name: "HALO Reporting"
    id: halo_reporting
    icon: mdi:cloud-upload
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  # On battery power, blank the screen unless motion/door activity woke it.
  - platform: template
    name: "Battery Screen Saver"
    id: battery_screensaver
    icon: mdi:monitor-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_off:
      then:
        - component.update: omni_display

  # Blanks the panel via the lambda gate (backlight stays on; BLK has no GPIO).
  - platform: template
    name: "Display Enabled"
    id: display_enabled
    icon: mdi:monitor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      then:
        - component.update: omni_display
    on_turn_off:
      then:
        - component.update: omni_display

  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_turn_off:
      then:
        - if:
            condition:
              binary_sensor.is_off: ota_mode
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

  # LED and buzzer feedback controls. All default ON = shipping behavior.
  - platform: template
    name: "Status LED Enabled"
    id: status_led_enabled
    icon: mdi:led-on
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: config
    disabled_by_default: true

  - platform: template
    name: "Alarm LED Enabled"
    id: alarm_led_enabled
    icon: mdi:alarm-light
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: config
    disabled_by_default: true

  - platform: template
    name: "Buzzer Enabled"
    id: buzzer_enabled
    icon: mdi:volume-high
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: config
    disabled_by_default: true

interval:
  - interval: 10s
    startup_delay: 60s
    then:
      - if:
          condition:
            lambda: !lambda |-
              return id(alarm_active).state;
          then:
            - lambda: !lambda |-
                if (id(alarm_led_enabled).state) {
                  id(rgb_light).turn_on().set_effect("Fast Pulse").perform();
                  id(rgb_light).turn_on().set_rgb(1, 0, 0).set_transition_length(0).perform();
                }
                if (id(buzzer_enabled).state) {
                  id(rtttl_buzzer).play(id(alarm_tone).state);
                }

  # AMC Omni door alarm: same cadence and LED/buzzer behavior as the existing
  # alarm interval above, gated by its own default-OFF switch. Short startup
  # delay (unlike the 60s one above): the latch itself already needs the door
  # open for Max Door Open Duration, so there is no boot-settling noise, and
  # 60s would eat two-thirds of a 90s deep-sleep wake window.
  - interval: 10s
    startup_delay: 10s
    then:
      - if:
          condition:
            and:
              - switch.is_on: alarm_door_open
              - binary_sensor.is_on: door_open_too_long
          then:
            - lambda: !lambda |-
                if (id(alarm_led_enabled).state) {
                  id(rgb_light).turn_on().set_effect("Fast Pulse").perform();
                  id(rgb_light).turn_on().set_rgb(1, 0, 0).set_transition_length(0).perform();
                }
                if (id(buzzer_enabled).state) {
                  id(rtttl_buzzer).play(id(alarm_tone).state);
                }

  # Interior over-temp alarm: same cadence and LED/buzzer behavior as the
  # door alarm above, gated by its own default-OFF switch.
  - interval: 10s
    startup_delay: 10s
    then:
      - if:
          condition:
            and:
              - switch.is_on: alarm_interior_temp
              - binary_sensor.is_on: interior_temp_too_long
          then:
            - lambda: !lambda |-
                if (id(alarm_led_enabled).state) {
                  id(rgb_light).turn_on().set_effect("Fast Pulse").perform();
                  id(rgb_light).turn_on().set_rgb(1, 0, 0).set_transition_length(0).perform();
                }
                if (id(buzzer_enabled).state) {
                  id(rtttl_buzzer).play(id(alarm_tone).state);
                }

  # ── HALO Smart Monitoring reporting ──────────────────────────────────────
  # MyMortuaryCooler HALO webhook, per their TEMP-1 v2.0.0 contract: HTTP GET
  # every 60s with device/secret/tC/rh/rssi/ssid/door/uptime. tC is Celsius
  # on the wire (our entities are native °F, converted here). Reports only
  # when HALO Reporting is on, credentials are set, and the probe is valid.
  - interval: 60s
    startup_delay: 30s
    then:
      - if:
          condition:
            and:
              - switch.is_on: halo_reporting
              - lambda: 'return !id(halo_device_id).state.empty() && !id(halo_secret).state.empty();'
          then:
            - if:
                condition:
                  lambda: 'return !std::isnan(id(dallas_temp_probe).state);'
                then:
                  - http_request.get:
                      url: !lambda |-
                        auto enc = [](const std::string &s) {
                          std::string out;
                          char buf[4];
                          for (unsigned char c : s) {
                            if (isalnum(c) || c == '-' || c == '_' || c == '.' || c == '~') {
                              out += (char) c;
                            } else {
                              snprintf(buf, sizeof(buf), "%%%02X", c);
                              out += buf;
                            }
                          }
                          return out;
                        };
                        char num[24];
                        std::string url = "https://fast-wombat-719.convex.site/apollo";
                        url += "?device=" + enc(id(halo_device_id).state);
                        url += "&secret=" + enc(id(halo_secret).state);
                        // HALO expects Celsius; entities are native Fahrenheit
                        snprintf(num, sizeof(num), "%.2f",
                                 (id(dallas_temp_probe).state - 32.0f) * 5.0f / 9.0f);
                        url += std::string("&tC=") + num;
                        const float rh = id(sht_humidity).state;
                        snprintf(num, sizeof(num), "%.1f", std::isnan(rh) ? -1.0f : rh);
                        url += std::string("&rh=") + num;
                        #ifdef USE_WIFI
                        snprintf(num, sizeof(num), "%d", (int) wifi::global_wifi_component->wifi_rssi());
                        url += std::string("&rssi=") + num;
                        url += "&ssid=" + enc(wifi::global_wifi_component->wifi_ssid());
                        #else
                        url += "&rssi=0&ssid=ETH";
                        #endif
                        url += std::string("&door=") + (id(door_sensor).state ? "1" : "0");
                        snprintf(num, sizeof(num), "%d", (int) id(sys_uptime).state);
                        url += std::string("&uptime=") + num;
                        return url;
                      on_response:
                        then:
                          - lambda: |-
                              char buf[48];
                              snprintf(buf, sizeof(buf), "HTTP %d at uptime %us",
                                       (int) response->status_code, (uint32_t) id(sys_uptime).state);
                              id(halo_last_report).publish_state(buf);
                      on_error:
                        then:
                          - lambda: |-
                              id(halo_last_report).publish_state("send failed");
                  # Subtle green report blink (HALO spec), unless an alarm
                  # owns the LED or the status LED is disabled.
                  - if:
                      condition:
                        and:
                          - switch.is_on: status_led_enabled
                          - binary_sensor.is_off: door_open_too_long
                          - binary_sensor.is_off: interior_temp_too_long
                          - binary_sensor.is_off: alarm_active
                      then:
                        - light.turn_on:
                            id: rgb_light
                            brightness: 20%
                            red: 0%
                            green: 100%
                            blue: 0%
                        - delay: 300ms
                        - light.turn_off: rgb_light
                else:
                  - lambda: |-
                      id(halo_last_report).publish_state("skipped: no probe reading");

  # Temperature and humidity configurable intervals
  - interval: 10s
    then:
      - lambda: |-
          // Temperature update check (min to milliseconds)
          uint32_t temp_interval_ms = id(temperature_update_interval).state * 60 * 1000;
          if (millis() - id(last_temp_update) >= temp_interval_ms) {
            id(sht_temperature).publish_state(id(sht_temperature_raw).state);
            id(last_temp_update) = millis();
          }
          
          // Humidity update check (min to milliseconds)
          uint32_t humidity_interval_ms = id(humidity_update_interval).state * 60 * 1000;
          if (millis() - id(last_humidity_update) >= humidity_interval_ms) {
            id(sht_humidity).publish_state(id(sht_humidity_raw).state);
            id(last_humidity_update) = millis();
          }

script:
  # Restarted every time the door opens, stopped when it closes. Only fires
  # the latch if the door is still open when the configured delay elapses.
  - id: door_open_timer
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t)(id(max_door_open_duration).state * 60.0f * 1000.0f);'
      - if:
          condition:
            binary_sensor.is_on: door_sensor
          then:
            - lambda: |-
                id(door_open_too_long).publish_state(true);

  # Started by the Dallas on_value handler when the interior first reads above
  # Max Temperature; only latches if it is STILL above when the delay elapses.
  - id: interior_temp_timer
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t)(id(interior_temp_alarm_duration).state * 60.0f * 1000.0f);'
      - if:
          condition:
            lambda: 'return !std::isnan(id(dallas_temp_probe).state) && id(dallas_temp_probe).state > id(max_interior_temp).state;'
          then:
            - lambda: |-
                id(interior_temp_too_long).publish_state(true);

  - id: reportAllValues
    then:
      - component.update: sht3xd_sensor
      - component.update: dallas_temp_probe
      - component.update: max_17048
      - delay: 2s
      - lambda: |-
          // Publish SHT temperature and humidity values
          id(sht_temperature).publish_state(id(sht_temperature_raw).state);
          id(sht_humidity).publish_state(id(sht_humidity_raw).state);
          id(last_temp_update) = millis();
          id(last_humidity_update) = millis();

# User-editable alarm tone. Default is the exact tone the firmware has
# always shipped with; both alarm play sites read this single source.
text:
  # ── HALO Smart Monitoring provisioning ──────────────────────────────────
  # Per-device credentials for the MyMortuaryCooler HALO backend. Set both
  # from HA, then flip HALO Reporting on. Kept as runtime entities (instead
  # of compile-time placeholders like HALO's TEMP-1 reference firmware) so
  # every Omni runs identical firmware.
  - platform: template
    name: "HALO Device ID"
    id: halo_device_id
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:identifier"

  - platform: template
    name: "HALO Webhook Secret"
    id: halo_secret
    mode: password
    max_length: 128
    optimistic: true
    restore_value: true
    entity_category: config
    icon: "mdi:key"

  - platform: template
    name: "Alarm Tone (RTTTL)"
    id: alarm_tone
    mode: text
    max_length: 128
    optimistic: true
    restore_value: true
    initial_value: "siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e;"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:music-note"

text_sensor:
  - platform: template
    name: "OTA URL"
    id: ota_url
    entity_category: "diagnostic"
    internal: true

  # Boot / identity diagnostics (published from on_boot; see esphome: block)
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      id: debug_reset_reason
      entity_category: diagnostic
      disabled_by_default: true

  - platform: version
    name: "ESPHome Version"
    id: sys_esphome_version
    entity_category: diagnostic
    disabled_by_default: true

  - platform: template
    name: "Firmware Version"
    id: firmware_version
    icon: "mdi:package-up"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  - platform: template
    name: "Wake Cause"
    id: wake_cause
    icon: "mdi:sleep-off"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  # Result of the most recent HALO webhook report (diagnostic).
  - platform: template
    name: "HALO Last Report"
    id: halo_last_report
    icon: "mdi:cloud-check"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  # Written by the ota on_error hooks in the variant files; survives reboot.
  # OTA failures and safe-mode rollbacks were previously invisible from HA.
  - platform: template
    name: "Last OTA Error"
    id: last_ota_error
    icon: "mdi:update-alert"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never