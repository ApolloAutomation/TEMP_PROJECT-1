interval:
  # No W5500 detected: park the driver's helper task so it can't crash the device polling
  # a floating SPI bus. Runs once after setup, from an interval so on_boot overrides can't drop it
  - id: w5500_park_interval
    interval: 1s
    then:
      - lambda: |-
          static bool checked = false;
          if (checked) return;
          checked = true;
          if (!id(ethernet_1).is_failed()) return;
          TaskHandle_t orphan = xTaskGetHandle("w5500_tsk");
          if (orphan != nullptr) {
            vTaskSuspend(orphan);
            ESP_LOGW("ethernet", "No W5500 detected; parked the W5500 helper task");
          }
  # Any DHCP restart wipes lwIP's shared DNS servers
  # Restore the default interface's copy, as CAST_PRO-1 does
  - id: dns_restore_interval
    interval: 16ms
    then:
      - lambda: |-
          esp_netif_t *netif = esp_netif_get_default_netif();
          if (netif == nullptr || !ip_addr_isany(dns_getserver(0))) return;
          bool restored = false;
          for (auto type : {ESP_NETIF_DNS_MAIN, ESP_NETIF_DNS_BACKUP}) {
            esp_netif_dns_info_t dns{};
            if (esp_netif_get_dns_info(netif, type, &dns) == ESP_OK && dns.ip.u_addr.ip4.addr != 0) {
              esp_netif_set_dns_info(netif, type, &dns);
              restored = true;
            }
          }
          static bool logged = false;
          if (restored && !logged) {
            logged = true;
            ESP_LOGI("network", "DHCP restart cleared DNS; restored the %s servers", esp_netif_get_desc(netif));
          }
  # Retry a released WiFi while Ethernet is up, so an outage doesn't leave the
  # radio silent until the next cable pull
  - id: wifi_recovery_interval
    interval: 10min
    then:
      - if:
          condition:
            and:
              - ethernet.connected:
              - not:
                  wifi.enabled:
              - lambda: "return id(wifi_provisioned) && id(wifi_fallback_on);"
          then:
            - script.execute: wifi_recovery_probe

  - interval: 10s
    startup_delay: 60s
    then:
      - if:
          condition:
            lambda: !lambda |-
              return id(alarm_active).state;
          then:
            - lambda: !lambda |-
                id(rgb_light).turn_on().set_effect("Fast Pulse").perform();
                id(rgb_light).turn_on().set_rgb(1, 0, 0).set_transition_length(0).perform();
                id(rtttl_buzzer).play("siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e;");

  # Temperature and humidity configurable intervals
  - interval: 10s
    then:
      - lambda: |-
          // Temperature update check (min to milliseconds)
          uint32_t temp_interval_ms = id(temperature_update_interval).state * 60 * 1000;
          if (millis() - id(last_temp_update) >= temp_interval_ms) {
            id(sht_temperature).publish_state(id(sht_temperature_raw).state);
            id(last_temp_update) = millis();
          }
          
          // Humidity update check (min to milliseconds)
          uint32_t humidity_interval_ms = id(humidity_update_interval).state * 60 * 1000;
          if (millis() - id(last_humidity_update) >= humidity_interval_ms) {
            id(sht_humidity).publish_state(id(sht_humidity_raw).state);
            id(last_humidity_update) = millis();
          }

script:
  # Re-allows deep sleep after Ethernet drops, but only once the link has been
  # down for 60s. A pending deep sleep fires as soon as it is allowed, so a
  # switch reboot, PoE renegotiation or DHCP loss must not release it while
  # the cable is still in
  - id: ethernet_rearm_sleep
    mode: restart
    then:
      - wait_until:
          condition:
            ethernet.connected:
          timeout: 60s
      - if:
          condition:
            and:
              - not:
                  ethernet.connected:
              - switch.is_off: prevent_sleep
              - binary_sensor.is_off: ota_mode
              - lambda: "return !id(alarm_triggered_on_wake);"
          then:
            - lambda: |-
                ESP_LOGI("Apollo", "Ethernet down for 60s; deep sleep allowed again");
                id(deep_sleep_1).allow_deep_sleep();

  - id: apply_ota_source
    # Sets the OTA manifest URL from the Firmware Channel select (Stable/Beta).
    # The manifests are per-variant (ota_*_manifest substitutions) so the legacy
    # _W/_ETH builds keep their own manifests. Literal URLs only: the update
    # entity keeps the raw pointer.
    then:
      - lambda: |-
          const bool beta = id(firmware_channel).current_option() == "Beta";
          const char *url = beta ? "${ota_beta_manifest}" : "${ota_stable_manifest}";
          ESP_LOGI("firmware", "OTA manifest set to: %s", url);
          id(update_http_request).set_source_url(url);
      - component.update: update_http_request

  - id: check_for_updates
    # One manifest check per boot, on whichever interface connects first
    then:
      - if:
          condition:
            lambda: "return !id(update_checked);"
          then:
            - lambda: "id(update_checked) = true;"
            - component.update: update_http_request

  - id: wifi_recovery_probe
    # Re-attempt WiFi while Ethernet carries the device; a rejoin restores dual-home
    then:
      - script.execute: wifi_reenable_radio
      - wait_until:
          condition:
            wifi.connected:
          timeout: 60s
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: "id(ethernet_expected) = false;"
          else:
            - if:
                condition:
                  ethernet.connected:
                then:
                  - script.execute: wifi_release_radio

  - id: wifi_reenable_radio
    # With provisioned (not YAML) networks, clear the STA list so start() reloads from and
    # saves to the boot-time NVS key; a second start() in one boot would otherwise switch keys
    then:
      - lambda: |-
          if (id(wifi_1).is_disabled() && !id(wifi_yaml_networks)) {
            id(wifi_1).clear_sta();
          }
      - wifi.enable:

  - id: wifi_release_radio
    # Turn WiFi off while Ethernet carries the device, ending AP+STA and the captive
    # portal. A live hotspot is only remembered (ap_latched); the reboot that clears
    # it happens on cable removal, never at cable connect, so a slow link can't loop.
    then:
      - lambda: "id(ethernet_expected) = true;"
      - if:
          condition:
            wifi.ap_active:
          then:
            - lambda: |-
                id(ap_latched) = true;
                ESP_LOGW("network", "Releasing the active hotspot; Ethernet carries the device");
      - wifi.disable:
      # Also stop Improv BLE so the device isn't offered for WiFi setup it can't complete
      - lambda: |-
          if (id(captive_portal_1).is_active()) {
            id(captive_portal_1).end();
          }
          id(esp32_improv_1).stop();

  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on:
                id: rgb_light
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  or:
                    - ethernet.connected:
                    - wifi.connected:
                then:
                  - logger.log: "Apollo Automation: Connected To Network"
                  - light.turn_on:
                      id: rgb_light
                      brightness: 100%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not Connected To Network"
                  - light.turn_on:
                      id: rgb_light
                      brightness: 100%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      - light.turn_off: rgb_light

  - id: testScript
    then:
      if:
        condition:
          - lambda: "return id(runTest) == true;"
        then:
          - lambda: "id(runTest) = false;"
          - lambda: "id(testCycleCount) = 0;"
          - while:
              condition:
                - lambda: "return id(testCycleCount) < 5;"
              then:
                - if:
                    condition:
                      - lambda: "return id(shtPassed) == false;"
                    then:
                      - if:
                          condition:
                            - lambda: "return id(sht_temperature_raw).state > -40 && id(sht_temperature_raw).state < 125;"
                          then:
                            - lambda: "id(shtPassed) = true;"
                - if:
                    condition:
                      - lambda: "return id(shtPassed);"
                    then:
                      - lambda: "id(testCycleCount) = 10;"
                - lambda: "id(runTest) = false;"
                - delay: 1s
                - lambda: "id(testCycleCount) += 1;"

          #Check If Test Passed To Trigger Lights
          - if:
              condition:
                - lambda: "return id(shtPassed);"
              then:
                - lambda: "id(runTest) = false;"
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 100%
                    blue: 0%
                - delay: 5s
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 0%
                    blue: 0%
                - light.turn_off:
                    id: rgb_light
              else:
                - lambda: "id(runTest) = false;"
                - light.turn_on:
                    id: rgb_light
                    red: 100%
                    green: 0%
                    blue: 0%
                - delay: 5s
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 0%
                    blue: 0%
                - light.turn_off:
                    id: rgb_light

  - id: reportAllValues
    then:
      # sen5x_number must run before sen55: run second, its blocking read
      # corrupts sen55's pending read of the same SEN55.
      - component.update: sen5x_number_component
      - component.update: sen55
      - component.update: sht3xd_sensor
      - component.update: dallas_temp_probe
      - component.update: dallas_temp_probe_2
      - component.update: dallas_temp_probe_3
      - component.update: dallas_temp_probe_4
      - component.update: max_17048
      - delay: 2s
      - lambda: |-
          // Publish SHT temperature and humidity values
          id(sht_temperature).publish_state(id(sht_temperature_raw).state);
          id(sht_humidity).publish_state(id(sht_humidity_raw).state);
          id(last_temp_update) = millis();
          id(last_humidity_update) = millis();

          // Publish total PM count using raw sensor values directly
          // pm_0_5_number = 0.3-0.5 range (cumulative <0.5)
          // Ranges: 0.3-0.5, 0.5-1, 1-2.5, 2.5-4, 4-10
          float pm_0_3_to_0_5 = id(pm_0_5_number).state;
          float pm_0_5_to_1 = std::max(0.0f, id(pm_1_0_number).state - id(pm_0_5_number).state);
          float pm_1_to_2_5 = std::max(0.0f, id(pm_2_5_number).state - id(pm_1_0_number).state);
          float pm_2_5_to_4 = std::max(0.0f, id(pm_4_0_number).state - id(pm_2_5_number).state);
          float pm_4_to_10 = std::max(0.0f, id(pm_10_0_number).state - id(pm_4_0_number).state);

          float total_count = pm_0_3_to_0_5 + pm_0_5_to_1 + pm_1_to_2_5 + pm_2_5_to_4 + pm_4_to_10;

          if (!std::isnan(total_count)) {
            id(total_pm_count).publish_state(total_count);
            ESP_LOGI("Apollo", "Total PM Count: %.0f", total_count);
          } else {
            ESP_LOGW("Apollo", "Total PM Count is NaN, skipping publish");
          }

select:
  - platform: template
    name: "Firmware Channel"
    id: firmware_channel
    icon: mdi:source-branch
    entity_category: "config"
    optimistic: true
    restore_value: true
    options:
      - "Stable"
      - "Beta"
    initial_option: "Stable"
    on_value:
      then:
        - script.execute: apply_ota_source

  - platform: ld2412
    out_pin_level:
      name: 'LD2412 Hardware output pin level'
      id: ld2412_out_pin_level
      disabled_by_default: true
    light_function:
      name: 'LD2412 Light Function'
      id: ld2412_light_function
      disabled_by_default: true
    distance_resolution:
      name: 'LD2412 Distance resolution'
      id: ld2412_distance_resolution
      disabled_by_default: true
    baud_rate:
      name: "LD2412 baud rate"
      id: ld2412_baud_rate
      disabled_by_default: true
      on_value:
        - delay: 3s
        - lambda: |-
            id(uart_ld2412).flush();
            uint32_t new_baud_rate = stoi(x);
            ESP_LOGD("change_baud_rate", "Changing baud rate from %i to %i", id(uart_ld2412).get_baud_rate(), new_baud_rate);
            if (id(uart_ld2412).get_baud_rate() != new_baud_rate) {
              id(uart_ld2412).set_baud_rate(new_baud_rate);
              id(uart_ld2412).load_settings();
            }

text_sensor:
  - platform: ld2412
    version:
      name: "LD2412 Firmware"
      id: ld2412_firmware
      disabled_by_default: true
    mac_address:
      name: "LD2412 BT MAC"
      id: ld2412_bt_mac
      disabled_by_default: true

  # Which path is carrying the device, for troubleshooting and HA notifications
  - platform: template
    name: "Network Connection"
    id: network_connection
    icon: "mdi:network"
    entity_category: "diagnostic"
    update_interval: 10s
    lambda: |-
      const bool eth = id(ethernet_1).is_connected();
      const bool sta = !id(wifi_1).is_disabled() && id(wifi_1).is_connected();
      const bool ap  = !id(wifi_1).is_disabled() && id(wifi_1).is_ap_active();
      if (eth && sta) return std::string("Ethernet + WiFi");
      if (eth) return std::string("Ethernet");
      if (sta) return std::string("WiFi");
      if (ap) return std::string("Hotspot");
      return std::string("Connecting");

  # Keeps the legacy IP Address entity for existing dashboards; shows the address in use, Ethernet first
  - platform: template
    name: "IP Address"
    id: legacy_ip_address
    entity_category: "diagnostic"
    update_interval: 10s
    lambda: |-
      if (id(ethernet_1).is_connected()) return id(eth_ip).state;
      if (!id(wifi_1).is_disabled() && id(wifi_1).is_connected()) return id(wifi_ip).state;
      return {};

  - platform: ethernet_info
    ip_address:
      name: "Ethernet IP Address"
      id: eth_ip
      entity_category: "diagnostic"
    mac_address:
      name: "Ethernet MAC Address"
      id: eth_mac_address
      entity_category: "diagnostic"
      disabled_by_default: true

  - platform: wifi_info
    ip_address:
      name: "WiFi IP Address"
      id: wifi_ip
      entity_category: "diagnostic"
    ssid:
      name: "Connected SSID"
      id: wifi_ssid
      entity_category: "diagnostic"
      disabled_by_default: true
    bssid:
      name: "Connected BSSID"
      id: wifi_bssid
      entity_category: "diagnostic"
      disabled_by_default: true
    mac_address:
      name: "MAC Address"
      id: wifi_mac_address
      entity_category: "diagnostic"
      disabled_by_default: true

  # Other diagnostics
  - platform: version
    name: "ESPHome Version"
    id: esphome_version
    hide_timestamp: true
    entity_category: "diagnostic"

  - platform: template
    name: "Apollo Firmware Version"
    id: apollo_firmware_version
    update_interval: never
    entity_category: "diagnostic"

  - platform: template
    name: "OTA URL"
    id: ota_url
    entity_category: "diagnostic"
    internal: true