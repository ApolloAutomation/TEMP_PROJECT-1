substitutions:
  version: "26.11.15.2"
  device_description: TEMP_PRO-1 made by Apollo Automation - version ${version}.

  # Manifest URL bases. Stable = GitHub Pages (main branch builds).
  # Beta = rolling "beta-fw" pre-release assets (beta branch builds).
  stable_manifest_base: "https://apolloautomation.github.io/TEMP_PROJECT-1"
  beta_manifest_base: "https://github.com/ApolloAutomation/TEMP_PROJECT-1/releases/download/beta-fw"

  # Legacy _W/_ETH shims override these so fielded devices keep their manifest URLs
  stable_manifest_dir: "firmware"
  # Must match the manifest-<key>.json names build-beta.yml uploads
  beta_manifest_key: "standard"
  ota_stable_manifest: "${stable_manifest_base}/${stable_manifest_dir}/manifest.json"
  ota_beta_manifest: "${beta_manifest_base}/manifest-${beta_manifest_key}.json"

  # Bluetooth Proxy switch state on a device with no stored preference yet
  # (first boot after this switch was added, or after a factory reset).
  bluetooth_proxy_restore_mode: RESTORE_DEFAULT_OFF
  # "false" keeps WiFi off entirely (Ethernet-only, like the old Ethernet firmware)
  wifi_fallback: "true"
  # The legacy _ETH shim sets "true" so an upgraded Ethernet unit's first boot is WiFi-silent
  ethernet_expected_default: "false"

esphome:
  name: temp-pro-1
  friendly_name: Apollo TEMP_PRO-1
  comment: Apollo TEMP_PRO-1
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio
  # improv_ble (renamed from esp32_improv) needs 2026.10
  min_version: 2026.10.0
  # dns_getserver() for the DNS restore interval
  includes:
    - <lwip/dns.h>
  on_boot:
    # Keep WiFi off when Ethernet is expected, so the fallback hotspot can't
    # broadcast while Ethernet waits for DHCP. Runs after globals restore (800), before wifi setup.
    - priority: 600
      then:
        - if:
            condition:
              lambda: "return id(ethernet_expected) || !id(wifi_fallback_on);"
            then:
              - lambda: "id(wifi_1).set_enable_on_boot(false);"
    # Publish the firmware version once per boot
    - priority: 500
      then:
        - text_sensor.template.publish:
            id: apollo_firmware_version
            state: "${version}"
    - priority: -100
      then:
        - delay: 2s
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(id(deep_sleep_sleep_duration).state * 60 * 60 * 1000);
        - if:
            condition:
              or:
                - binary_sensor.is_on: ota_mode
                - switch.is_on: prevent_sleep
            then:
              - lambda: |-
                  ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA Or Switch On Boot");
                  id(deep_sleep_1).prevent_deep_sleep();
        - lambda: |-
            // Force initial updates on boot
            id(sht_temperature).publish_state(id(sht_temperature_raw).state);
            id(sht_humidity).publish_state(id(sht_humidity_raw).state);
            id(last_temp_update) = millis();
            id(last_humidity_update) = millis();
    - priority: -100
      then:
        - script.execute: apply_ota_source
    # Re-apply the Bluetooth Proxy switch after all components set up, so BLE
    # scanning matches the switch state restored from flash.
    - priority: -300
      then:
        - if:
            condition:
              switch.is_on: bluetooth_proxy_switch
            then:
              - esp32_ble_tracker.start_scan:
                  continuous: true
            else:
              - esp32_ble_tracker.stop_scan:
    # Ethernet never came up, so bring WiFi back for rejoin or provisioning
    - priority: -100
      then:
        - if:
            condition:
              lambda: "return id(ethernet_expected) && id(wifi_fallback_on);"
            then:
              - wait_until:
                  condition:
                    ethernet.connected:
                  timeout: 20s
              # A never-provisioned unit would open the hotspot here, so give a link
              # behind spanning tree (~30s to forward) more time first
              - if:
                  condition:
                    and:
                      - not:
                          ethernet.connected:
                      - lambda: "return !id(wifi_provisioned);"
                  then:
                    - wait_until:
                        condition:
                          ethernet.connected:
                        timeout: 40s
              - if:
                  condition:
                    not:
                      ethernet.connected:
                  then:
                    - lambda: "id(ethernet_expected) = false;"
                    - script.execute: wifi_reenable_radio

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_managed

safe_mode:

logger:

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: ${ota_stable_manifest}

# Prefer Ethernet whenever it is connected; ESPHome arbitrates the route
network:
  priority:
    - ethernet
    - wifi

ethernet:
  id: ethernet_1
  type: W5500
  clk_pin: GPIO10
  mosi_pin: GPIO12
  miso_pin: GPIO11
  cs_pin: GPIO9
  interrupt_pin: GPIO13
  reset_pin: GPIO14
  on_connect:
    # A wired device never deep sleeps
    - lambda: |-
        ESP_LOGI("Apollo", "Ethernet connected; preventing deep sleep");
        id(deep_sleep_1).prevent_deep_sleep();
    - script.stop: ethernet_rearm_sleep
    # Keep WiFi up alongside Ethernet so Home Assistant's connection to the
    # WiFi address survives; release it only when WiFi has no network to offer
    - if:
        condition:
          wifi.enabled:
        then:
          - if:
              condition:
                wifi.ap_active:
              then:
                # Fallback hotspot is broadcasting: WiFi has no network
                - script.execute: wifi_release_radio
              else:
                # WiFi may still be associating at boot, so wait it out.
                # Ends early if the fallback AP starts.
                - wait_until:
                    condition:
                      or:
                        - wifi.connected:
                        - wifi.ap_active:
                    timeout: 30s
                - if:
                    condition:
                      wifi.connected:
                    then:
                      - lambda: "id(ethernet_expected) = false;"
                    else:
                      # Leave WiFi alone if the cable vanished during the wait
                      - if:
                          condition:
                            ethernet.connected:
                          then:
                            - script.execute: wifi_release_radio
        else:
          # WiFi-silent boot (ethernet_expected): stays off
          - lambda: "id(ethernet_expected) = true;"
    - script.execute: check_for_updates
    - component.update: network_connection
  on_disconnect:
    # Off the cable, deep sleep follows Prevent Sleep and OTA Mode again, but
    # only after the link-blip window (runs in the background)
    - script.execute: ethernet_rearm_sleep
    # Cable gone, so bring WiFi up to rejoin or open the provisioning hotspot
    - lambda: "id(ethernet_expected) = false;"
    - if:
        condition:
          and:
            - lambda: "return id(ap_latched);"
            - not:
                wifi.connected:
        then:
          # ESPHome can't relaunch a once-started hotspot in the same boot, so reboot
          # into a fresh one, but only for a real cable pull (not a link blip)
          - wait_until:
              condition:
                ethernet.connected:
              timeout: 15s
          - if:
              condition:
                and:
                  - not:
                      ethernet.connected:
                  - not:
                      wifi.connected:
              then:
                - lambda: |-
                    ESP_LOGW("network", "Cable removed after the hotspot was released; rebooting to restore provisioning");
                - delay: 500ms
                - lambda: "App.safe_reboot();"
        else:
          - if:
              condition:
                lambda: "return id(wifi_fallback_on);"
              then:
                - script.execute: wifi_reenable_radio
    - component.update: network_connection

wifi:
  id: wifi_1
  on_connect:
    # Must stay set: gates the recovery probe so it never pops the hotspot on
    # a device that was never provisioned
    - lambda: "id(wifi_provisioned) = true;"
    - script.execute: check_for_updates
    - component.update: network_connection
  on_disconnect:
    # Turn WiFi off after 60s without reassociation, which keeps the 90s
    # fallback hotspot from ever starting while Ethernet carries the device
    - if:
        condition:
          ethernet.connected:
        then:
          - wait_until:
              condition:
                wifi.connected:
              timeout: 60s
          - if:
              condition:
                and:
                  - wifi.enabled:
                  - not:
                      wifi.connected:
                  - ethernet.connected:
              then:
                - script.execute: wifi_release_radio
    - component.update: network_connection
  # Keeps today's no-reboot on lost Wi-Fi; 2026.11 drops the AP exemption
  reboot_timeout: 0s
  ap:
    ssid: "Apollo TEMP_PRO-1 Hotspot"

captive_portal:
  id: captive_portal_1

improv_serial:

improv_ble:
  id: esp32_improv_1
  authorizer: none

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# EXPERIMENTAL: Include custom component for SEN5x particle number concentration
external_components:
  - source:
      type: local
      path: local_components
  - source: github://ApolloAutomation/esphome-battery-component
    components: [max17048]

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: true

bluetooth_proxy:

http_request:
  verify_ssl: true
  # GitHub release-asset downloads answer with a redirect carrying a
  # ~3.6 KB Content-Security-Policy header; each header line must fit
  # this buffer or the request fails with "HTTP_CLIENT: Out of buffer".
  buffer_size_rx: 5120
  # The redirect target is a signed URL with a ~850-char query string; the
  # follow-up request line must fit the TX buffer or esp_http_client_open
  # fails with "Out of buffer" before sending anything.
  buffer_size_tx: 2048

api:
  encryption:
  services:
    - service: play_buzzer
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
  reboot_timeout: 0s
  on_client_connected:
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA Or Switch");
          else:
            - switch.turn_on: accessory_power
            - delay: 5s
            - lambda: |-
                id(reportAllValues).execute();
            - delay: 5s
            - lambda: |-
                // Check alarm conditions directly
                id(alarm_triggered_on_wake) = false;

                // Check temperature alarm (only if value is valid)
                if (id(alarm_outside_temp_range).state &&
                    !std::isnan(id(sht_temperature).state) &&
                    (id(sht_temperature).state > id(max_temp).state || id(sht_temperature).state < id(min_temp).state)) {
                  id(alarm_triggered_on_wake) = true;
                  ESP_LOGW("Apollo", "Temperature alarm triggered");
                }

                // Check humidity alarm (only if value is valid)
                if (id(alarm_outside_humidity_range).state &&
                    !std::isnan(id(sht_humidity).state) &&
                    (id(sht_humidity).state > id(max_humidity).state || id(sht_humidity).state < id(min_humidity).state)) {
                  id(alarm_triggered_on_wake) = true;
                  ESP_LOGW("Apollo", "Humidity alarm triggered");
                }

                // Check PM mass alarm (only if value is valid)
                if (id(alarm_outside_total_pm_range).state &&
                    !std::isnan(id(pm_10_0).state) &&
                    id(pm_10_0).state >= id(max_total_pm).state) {
                  id(alarm_triggered_on_wake) = true;
                  ESP_LOGW("Apollo", "PM mass alarm triggered");
                }

                // Check PM count alarm (only if value is valid)
                if (id(alarm_outside_total_pm_count_range).state &&
                    !std::isnan(id(total_pm_count).state) &&
                    id(total_pm_count).state >= id(max_total_pm_count).state) {
                  id(alarm_triggered_on_wake) = true;
                  ESP_LOGW("Apollo", "PM count alarm triggered: %.0f >= %.0f", id(total_pm_count).state, id(max_total_pm_count).state);
                }

                if (id(alarm_triggered_on_wake)) {
                  ESP_LOGW("Apollo", "Alarm Active - Staying Awake");
                  id(deep_sleep_1).prevent_deep_sleep();
                  // Trigger alarm sound and light
                  id(rgb_light).turn_on().set_effect("Fast Pulse").perform();
                  id(rgb_light).turn_on().set_rgb(1, 0, 0).set_transition_length(0).perform();
                  id(rtttl_buzzer).play("siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e;");
                }
            - if:
                condition:
                  and:
                    - lambda: 'return !id(alarm_triggered_on_wake);'
                    - switch.is_off: prevent_sleep
                    - binary_sensor.is_off: ota_mode
                    # A wired device never deep sleeps
                    - not:
                        ethernet.connected:
                then:
                  - deep_sleep.enter:
                      id: deep_sleep_1

globals:
  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: button_press_timestamp
    restore_value: no
    type: uint32_t
    initial_value: '0'
  - id: runTest
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: testCycleCount
    type: int
    restore_value: no
    initial_value: '0'
  - id: shtPassed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: alarm_triggered_on_wake
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_temp_update
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_humidity_update
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # True when WiFi was released while Ethernet carried the device, which makes
  # the next boot start WiFi-silent
  - id: ethernet_expected
    type: bool
    restore_value: yes
    initial_value: '${ethernet_expected_default}'
  # True once WiFi has ever connected, which gates the WiFi recovery probe
  - id: wifi_provisioned
    type: bool
    restore_value: yes
    initial_value: 'false'
  # One update check per boot, on whichever interface connects first
  - id: update_checked
    type: bool
    restore_value: no
    initial_value: 'false'
  # True once the hotspot has run and been released this boot (it can't relaunch
  # until the next reboot)
  - id: ap_latched
    type: bool
    restore_value: no
    initial_value: 'false'
  # The wifi_fallback substitution as a bool; false is accepted quoted or unquoted
  - id: wifi_fallback_on
    type: bool
    restore_value: no
    initial_value: 'std::string_view("${wifi_fallback}") != "false" && std::string_view("${wifi_fallback}") != "False"'
  # True when WiFi networks come from YAML; set in the initializer (after wifi adds YAML
  # networks, before saved ones load) so a user's on_boot override can't drop it
  - id: wifi_yaml_networks
    type: bool
    restore_value: no
    initial_value: 'wifi::global_wifi_component != nullptr && wifi::global_wifi_component->has_sta()'

i2c:
  sda: GPIO16
  scl: GPIO17
  id: bus_a

web_server:
  port: 80

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 1h
  run_duration: 90s

one_wire:
  - platform: gpio
    pin: GPIO6

uart:
  - id: uart_ld2412
    tx_pin: GPIO39
    rx_pin: GPIO40
    baud_rate: 115200
    parity: NONE
    stop_bits: 1

ld2412:
  id: ld2412_radar
  uart_id: uart_ld2412

# Buzzer
output:
  - platform: ledc
    pin: GPIO8
    id: buzzer

rtttl:
  id: rtttl_buzzer
  output: buzzer

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
    disabled_by_default: true
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    id: reset_button
    on_press:
      then:
        - lambda: |-
            id(button_press_timestamp) = millis();    
    on_release:
      then:
        - lambda: |-
            if (millis() - id(button_press_timestamp) >= 10000) {
              id(prevent_sleep).turn_on();
              id(factory_reset_switch).turn_on();
            }
            else if (millis() - id(button_press_timestamp) >= 3000) {
              //Turn Prevent Sleep On
              id(prevent_sleep).turn_on();
              //Prevent Sleep
              id(deep_sleep_1).prevent_deep_sleep();
            }
            else {
              // StatusCheck
              id(statusCheck).execute();
              delay(3000);
              id(testCycleCount) = 0;
              id(runTest) = true;
              id(testScript).execute();
            }

  - platform: ld2412
    dynamic_background_correction_status:
      name: "LD2412 Dynamic Background Correction Status"
      id: ld2412_dynamic_background_correction_status
      disabled_by_default: true
    has_target:
      name: "LD2412 Presence"
      id: ld2412_presence
    has_moving_target:
      name: "LD2412 Moving Target"
      id: ld2412_moving_target
      disabled_by_default: true
    has_still_target:
      name: "LD2412 Still Target"
      id: ld2412_still_target
      disabled_by_default: true

  - platform: template
    name: Alarm Temperature Within Range
    id: temp_within_range
    disabled_by_default: true
    lambda: 'return std::isnan(id(sht_temperature).state) || ((id(sht_temperature).state <= id(max_temp).state) && (id(sht_temperature).state >= id(min_temp).state));'

  - platform: template
    name: Alarm Humidity Within Range
    id: humidity_within_range
    disabled_by_default: true
    lambda: 'return std::isnan(id(sht_humidity).state) || ((id(sht_humidity).state <= id(max_humidity).state) && (id(sht_humidity).state >= id(min_humidity).state));'

  - platform: template
    name: Alarm Total PM Within Range
    id: total_pm_within_range
    disabled_by_default: true
    lambda: 'return std::isnan(id(pm_10_0).state) || (id(pm_10_0).state < id(max_total_pm).state);'

  - platform: template
    name: Alarm Total PM Count Within Range
    id: total_pm_count_within_range
    disabled_by_default: true
    lambda: 'return std::isnan(id(total_pm_count).state) || (id(total_pm_count).state < id(max_total_pm_count).state);'

  - platform: template
    name: Alarm Active
    id: alarm_active
    disabled_by_default: true
    lambda: 'return (id(alarm_outside_temp_range).state && !id(temp_within_range).state) || (id(alarm_outside_humidity_range).state && !id(humidity_within_range).state) || (id(alarm_outside_total_pm_range).state && !id(total_pm_within_range).state) || (id(alarm_outside_total_pm_count_range).state && !id(total_pm_count_within_range).state);'
    on_release:
      then:
        - light.turn_off: rgb_light
        - if:
            condition:
              and:
                - switch.is_off: prevent_sleep
                - binary_sensor.is_off: ota_mode
                - not:
                    ethernet.connected:
            then:
              - lambda: |-
                  ESP_LOGW("Apollo", "Alarm cleared - going back to sleep");
                  id(deep_sleep_1).allow_deep_sleep();
              - delay: 2s
              - deep_sleep.enter:
                  id: deep_sleep_1

  - platform: homeassistant
    name: "OTA Mode"
    id: ota_mode
    entity_id: input_boolean.apollo_ota_mode
    disabled_by_default: true
    on_press:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_release:
      then:
        - if:
            condition:
              and:
                - switch.is_off: prevent_sleep
                - not:
                    ethernet.connected:
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

sensor:
  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature
    disabled_by_default: true

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s
    disabled_by_default: true

  - platform: sht3xd
    id: sht3xd_sensor
    temperature:
      name: "Temperature Raw"
      id: sht_temperature_raw
      internal: true
    humidity:
      name: "Relative Humidity Raw"
      id: sht_humidity_raw
      internal: true
    update_interval: 10s

  # Template sensors with configurable intervals
  - platform: template
    name: "Temperature"
    id: sht_temperature
    lambda: 'return id(sht_temperature_raw).state;'
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "Relative Humidity"
    id: sht_humidity
    lambda: 'return id(sht_humidity_raw).state;'
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: sen5x
    id: sen55
    pm_1_0:
      name: "PM <1µm Weight concentration"
      id: pm_1_0
      disabled_by_default: true
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 9
            send_every: 1
    pm_2_5:
      name: "PM <2.5µm Weight concentration"
      id: pm_2_5
      disabled_by_default: true
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 9
            send_every: 1
    pm_4_0:
      name: "PM <4µm Weight concentration"
      id: pm_4_0
      disabled_by_default: true
      accuracy_decimals: 1
    pm_10_0:
      name: "PM <10µm Weight concentration"
      id: pm_10_0
      accuracy_decimals: 1
    nox:
      name: "NOX Index"
      id: sen_nox
      disabled_by_default: true
      accuracy_decimals: 1
    voc:
      name: "VOC Index"
      id: sen_voc
      disabled_by_default: true
      algorithm_tuning:
        index_offset: 100
        learning_time_offset_hours: 12
        learning_time_gain_hours: 12
        gating_max_duration_minutes: 180
        std_initial: 50
        gain_factor: 230
      filters:
        - sliding_window_moving_average:
            window_size: 9
            send_every: 1
    temperature_compensation:
      offset: 0
      normalized_offset_slope: 0
      time_constant: 0
    store_baseline: true
    update_interval: 10s

  - platform: template
    name: "PM 0.3 To 1 µm"
    id: pm0_3_to_1
    disabled_by_default: true
    lambda: return id(pm_1_0).state;
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s
    
  - platform: template
    name: "PM 1 To 2.5 µm"
    id: pm1_to_2_5
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_2_5).state - id(pm_1_0).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s
  
  - platform: template
    name: "PM 2.5 To 4 µm"
    id: pm2_5_to_4
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_4_0).state - id(pm_2_5).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  - platform: template
    name: "PM 4 To 10 µm"
    id: pm4_to_10
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_10_0).state - id(pm_4_0).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  # EXPERIMENTAL: SEN5x Particle Number Concentration Sensors
  # Uses undocumented I2C command 0x0413
  # Reference: Sensirion_SEN5x_Read_Mass_and_Number_Concentrations.pdf
  - platform: sen5x_number
    id: sen5x_number_component
    address: 0x69
    update_interval: 10s
    pm_0_5_number:
      name: "PM <0.5µm Number concentration"
      id: pm_0_5_number
