# Legacy WiFi-variant shim: builds the unified firmware but keeps the original
# device/project name and firmware-w/ manifest path so fielded devices keep updating.
# New installs should use TEMP_PRO-1.yaml.

substitutions:
  stable_manifest_dir: "firmware-w"
  beta_manifest_key: "w"

esphome:
  name: "apollo-temp-pro-1-w"
  friendly_name: Apollo TEMP_PRO-1 W
  comment: Apollo TEMP_PRO-1 W
  project:
    name: "ApolloAutomation.TEMP_PRO-1-W"
    version: "${version}"

dashboard_import:
  package_import_url: github://ApolloAutomation/TEMP_PROJECT-1/Integrations/ESPHome/TEMP_PRO-1_W.yaml
  import_full_config: false

packages:
  core: !include Core.yaml
