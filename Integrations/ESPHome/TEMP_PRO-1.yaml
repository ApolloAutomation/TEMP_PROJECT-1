# Apollo TEMP_PRO-1 unified firmware: WiFi and Ethernet in one image.
# Ethernet is used whenever a cable is plugged in; WiFi is the fallback. Device config lives in Core.yaml.

esphome:
  name: "apollo-temp-pro-1"
  project:
    name: "ApolloAutomation.TEMP_PRO-1"
    version: "${version}"

dashboard_import:
  package_import_url: github://ApolloAutomation/TEMP_PROJECT-1/Integrations/ESPHome/TEMP_PRO-1.yaml
  import_full_config: false

packages:
  core: !include Core.yaml
