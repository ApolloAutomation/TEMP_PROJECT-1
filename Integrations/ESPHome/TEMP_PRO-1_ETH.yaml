# Legacy Ethernet-variant shim: builds the unified firmware but keeps the original
# device/project name and firmware-e/ manifest path so fielded devices keep updating.
# New installs should use TEMP_PRO-1.yaml.

substitutions:
  stable_manifest_dir: "firmware-e"
  beta_manifest_key: "e"
  # Keep WiFi off on the first boot after upgrading from the Ethernet-only firmware
  ethernet_expected_default: "true"
  # Keep "MAC Address" on the Ethernet MAC, as the Ethernet-only firmware had it
  ethernet_mac_name: "MAC Address"
  wifi_mac_name: "WiFi MAC Address"

esphome:
  name: "apollo-temp-pro-1-eth"
  friendly_name: Apollo TEMP_PRO-1 ETH
  comment: Apollo TEMP_PRO-1 ETH
  project:
    name: "ApolloAutomation.TEMP_PRO-1-ETH"
    version: "${version}"

dashboard_import:
  package_import_url: github://ApolloAutomation/TEMP_PROJECT-1/Integrations/ESPHome/TEMP_PRO-1_ETH.yaml
  import_full_config: false

packages:
  core: !include Core.yaml
